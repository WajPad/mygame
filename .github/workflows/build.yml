name: 2 - Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build za Windows (.exe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-StandaloneWindows64-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-StandaloneWindows64-
            Library-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: StandaloneWindows64
          unityVersion: 2022.3.45f1
          buildMethod: BuildScript.BuildWindows
          buildName: ForestSurvival
          versioning: None

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ForestSurvival-Windows
          path: build/StandaloneWindows64
